# RandLA-Net hyperparameters — HFX3D benchmark

model:
  name: RandLANet
  num_layers: 4
  num_classes: 12
  in_channels: 7         # xyz(3) + rgb(3) + intensity(1)
  knn: 16

training:
  epochs: 200
  optimizer: Adam
  subsampling: random
  knn_backend: scipy.cKDTree

data:
  num_classes: 12
  classes: [wall, window, door, balcony, vegetation, stairs, terrain, roof, blinds, other, column, arch]
  features: [xyz, rgb, intensity]
