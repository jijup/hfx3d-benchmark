# RandLA-Net hyperparameters used for HFX3D benchmark
# Full run: 100 epochs, 2×H100 — in progress

model:
  name: RandLANet
  num_layers: 4
  num_classes: 12
  in_channels: 7         # xyz(3) + rgb(3) + intensity(1)
  knn: 16

training:
  epochs: 100
  optimizer: Adam
  subsampling: random    # ~40k–65k points per building per iteration
  knn_backend: scipy.cKDTree   # C++ ops replaced for Apptainer compatibility

data:
  num_classes: 12
  classes: [wall, window, door, balcony, vegetation, stairs, terrain, roof, blinds, other, column, arch]
  features: [xyz, rgb, intensity]
