io:
  chunk_points: 500000

filtering:
  minimum_instance_points: 1

sampling:
  max_points_per_instance: 12000

local_frame:
  facade_reference_class: wall
  max_reference_points: 100000
  ground_percentile: 1.0

geometry:
  spacing_sample_points: 1500
  minimum_top_surface_points: 30
  top_surface_percentile: 82.0
  top_low_percentile: 25.0
  boundary_band_fraction: 0.16

plane_extraction:
  minimum_neighbors: 16
  normal_neighbors: 24
  max_normal_queries: 128
  distinct_plane_angle_degrees: 12.0

instance_graph:
  centroid_nearest_k: 12
  candidate_minimum_distance: 1.5
  distance_sample_points: 512

# Semantic roles used only to select candidate neighbors by class.
semantic_roles:
  host_surface:
  - wall
  vegetation:
  - vegetation
  blind:
  - blinds
  window:
  - window
  upper_building:
  - wall
  - roof
  - balcony
  - column
  - arch
  lower_support:
  - wall
  - column
  access_connector:
  - door
  - stairs
  barrier_proxy:
  - wall
  - column
  - other
  - blinds
  drainage_neighbor:
  - other

# Default semantic class-attribute prior table.
# Every applicable pair uses its configured prior. Instance-dependent pairs
# refine it with geometry/context; always pairs use neutral G=C=0.5.
semantic_priors:
  by_class:
    wall:
      load_bearing: 0.65
      thermal_envelope: 0.9
      vegetation_support: 0.4
    window:
      thermal_envelope: 0.9
      operable: 0.85
      solar_shading: 0.7
      ventilation: 0.75
      natural_lighting: 0.9
    door:
      access: 0.9
      operable: 0.9
      thermal_envelope: 0.9
    balcony:
      load_bearing: 0.9
      access: 0.9
      vegetation_support: 0.1
      fall_protection: 0.9
    vegetation:
      aesthetic: 0.9
    stairs:
      circulation: 0.9
      fall_protection: 0.9
    terrain:
      circulation: 0.85
    roof:
      thermal_envelope: 0.9
      load_bearing: 0.85
      drainage: 0.4
      fall_protection: 0.75
    blinds:
      solar_shading: 0.9
      operable: 0.9
      privacy_screening: 0.9
    column:
      load_bearing: 0.9
      aesthetic: 0.5
    arch:
      load_bearing: 0.35
      aesthetic: 0.25
      illumination: 0.35
      surveillance: 0.45

# Continuous normalization scales (single shared values, not per-condition
# thresholds). Angles are normalized by 30 degrees; distances are normalized
# by instance-local point spacing.
scoring:
  slope_full_scale_degrees: 30.0
  spacing_multiplier_protrusion: 4.0
  contact_radius_multiplier: 3.0
  ground_gap_spacing_multiplier: 4.0
  ground_gap_building_fraction: 0.1
  barrier_min_verticality: 0.55
  building_height_floor: 1.0
  cluster_radius_multiplier: 2.0
  handle_min_points: 6
  device_min_points: 6
  device_min_compactness: 0.4

numerical:
  epsilon: 1.0e-9
  odds_epsilon: 1.0e-6

output:
  compression: gzip
  compression_level: 4
  deterministic_creation_time: '2026-08-09T00:00:00+08:00'
