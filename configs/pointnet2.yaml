# PointNet / PointNet++ hyperparameters — HFX3D benchmark

pointnet:
  name: PointNet
  num_classes: 12
  in_channels: 7         # xyz(3) + rgb(3) + intensity(1)

pointnet2_ssg:
  name: PointNet2_SSG
  num_classes: 12
  in_channels: 7         # xyz(3) + rgb(3) + intensity(1)
  grouping: SSG

training:
  epochs: 200
  optimizer: Adam
  lr: 0.001
  lr_decay: 0.7
  lr_decay_every: 10
  num_points: 4096
  sample_rate: 1.0
  batch_size: 8

data:
  num_classes: 12
  classes: [wall, window, door, balcony, vegetation, stairs, terrain, roof, blinds, other, column, arch]
  features: [xyz, rgb, intensity]
