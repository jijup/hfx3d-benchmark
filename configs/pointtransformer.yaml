# Point Transformer hyperparameters — HFX3D benchmark

ptv2m2:
  model: DefaultSegmentor
  in_channels: 7         # xyz(3) + rgb(3) + intensity(1)
  num_classes: 12
  epochs: 200
  optimizer: AdamW
  lr: 0.006
  batch_size: 6

ptv3:
  model: DefaultSegmentorV2
  in_channels: 4         # rgb(3) + intensity(1)
  num_classes: 12
  epochs: 200
  return_grid_coord: true
  flash_attention: true
  optimizer: AdamW
  lr: 0.006
  batch_size: 6

data:
  classes: [wall, window, door, balcony, vegetation, stairs, terrain, roof, blinds, other, column, arch]
  voxel_size: 0.04
